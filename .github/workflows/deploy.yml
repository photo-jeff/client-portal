name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        run: npx vercel deploy --prod --yes --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_sgyhOssCHOxbGpCvWMNykBMH
          VERCEL_PROJECT_ID: prj_MFet4tUNUSx0uDFpsp2QNABy2Y6X
